<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VoxRevive — Neural Voice Reconstruction</title>
<style>
body {
    background: #0f1115;
    color: #e6e6e6;
    font-family: "Segoe UI", sans-serif;
    margin: 0;
    padding: 40px;
}

.container {
    max-width: 800px;
    margin: auto;
}

h1 {
    font-weight: 500;
    letter-spacing: 1px;
}

.sub {
    color: #888;
    margin-bottom: 30px;
}

.card {
    background: #1a1d24;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 20px;
}

button {
    background: #3a7afe;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
}

button:disabled {
    background: #444;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #111;
    color: white;
    border: 1px solid #333;
    border-radius: 6px;
}

.progress-bar {
    width: 100%;
    height: 10px;
    background: #222;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 10px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #3a7afe;
    transition: width 0.3s;
}

.log {
    font-family: monospace;
    font-size: 13px;
    color: #9aff9a;
    margin-top: 10px;
    height: 80px;
    overflow-y: auto;
    background: #0b0c10;
    padding: 10px;
    border-radius: 6px;
}

.status {
    font-size: 14px;
    color: #aaa;
    margin-top: 5px;
}
</style>
</head>
<body>

<div class="container">
    <h1>VoxRevive</h1>
    <div class="sub">Neural Voice Reconstruction Engine v3.2</div>

    <div class="card">
        <label>Upload Source Audio</label>
        <input type="file" id="audioUpload">
        <button onclick="startAnalysis()">Analyze Voice</button>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="status" id="status">Awaiting input...</div>
        <div class="log" id="log"></div>
    </div>

    <div class="card">
        <label>Enter Text to Generate Voice</label>
        <textarea id="textInput" rows="4" placeholder="Type new sentence..."></textarea>
        <button onclick="generateVoice()" id="generateBtn" disabled>Generate Voice</button>
  <audio id="audioPlayer" controls style="margin-top:15px; width:100%; display:none;"></audio>
    </div>
</div>

<script>
let progress = 0;
let interval;

function startAnalysis() {
    progress = 0;
    document.getElementById("log").innerHTML = "";
    document.getElementById("status").innerText = "Analyzing voice pattern...";
    document.getElementById("generateBtn").disabled = true;

    interval = setInterval(() => {
        progress += 5;
        document.getElementById("progress").style.width = progress + "%";

        if (progress === 10) log("Extracting vocal signature...");
        if (progress === 30) log("Mapping emotional contour...");
        if (progress === 55) log("Reconstructing neural voiceprint...");
        if (progress === 80) log("Stability check: 82%");
        if (progress === 95) log("Authenticity cannot be guaranteed.");

        if (progress >= 100) {
            clearInterval(interval);
            document.getElementById("status").innerText = "Voice reconstruction ready.";
            document.getElementById("generateBtn").disabled = false;
        }
    }, 150);
}

function generateVoice() {
    document.getElementById("status").innerText = "Generating synthetic voice...";

    setTimeout(() => {
        const audio = document.getElementById("audioPlayer");
        
        const sampleRate = 44100;
        const duration = 60; // 60 detik
        const numSamples = sampleRate * duration;
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
        
        writeString(view, 0, "RIFF");
        view.setUint32(4, 36 + numSamples * 2, true);
        writeString(view, 8, "WAVE");
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, "data");
        view.setUint32(40, numSamples * 2, true);

        for (let i = 0; i < numSamples; i++) {
            view.setInt16(44 + i * 2, 0, true);
        }

        const blob = new Blob([view], { type: "audio/wav" });
        const url = URL.createObjectURL(blob);

        audio.src = url;
        audio.style.display = "block";
        audio.load();

        document.getElementById("status").innerText = "Generation complete.";

    }, 2000);
}
function log(message) {
    const logBox = document.getElementById("log");
    logBox.innerHTML += "> " + message + "<br>";
    logBox.scrollTop = logBox.scrollHeight;
}
</script>

</body>
</html>
